name: build-twrp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MANIFEST_BRANCH: twrp-14.1
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 lz4 cpio rsync
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: Sync TWRP tree
        run: |
          mkdir -p $HOME/twrp && cd $HOME/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$MANIFEST_BRANCH"
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          df -h .

      - uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Put device tree in place
        run: |
          mkdir -p $HOME/twrp/device/samsung
          cp -a device_tree $HOME/twrp/device/samsung/gts10fewifi
          rm -rf $HOME/twrp/device/samsung/gts10fewifi/.git

      - name: Build
        run: |
          set +e
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_gts10fewifi-ap2a-eng || lunch twrp_gts10fewifi-eng
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          [ "$TARGET_PRODUCT" = "twrp_gts10fewifi" ] || { echo "lunch failed"; exit 1; }
          mka vendorbootimage -j4 || exit 1
          ls -l out/target/product/gts10fewifi/vendor_boot.img

      - name: Extract recovery fragment
        run: |
          cd $HOME/twrp
          T=system/tools/mkbootimg
          [ -f $T/unpack_bootimg.py ] || T=$(dirname $(find . -name unpack_bootimg.py | head -1))
          python3 $T/unpack_bootimg.py --boot_img out/target/product/gts10fewifi/vendor_boot.img --out $HOME/built | tee $HOME/unpack.txt
          grep -B4 "name: recovery" $HOME/unpack.txt
          cp $HOME/built/vendor_ramdisk01 $GITHUB_WORKSPACE/twrp_recovery.cpio.lz4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" twrp_recovery.cpio.lz4 --repo "${{ github.repository }}" --title "TWRP fragment ${{ github.run_number }}" --notes "recovery fragment (vendor_ramdisk01) for gts10fewifi"
